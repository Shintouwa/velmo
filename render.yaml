services:
  - type: web
    name: velmo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SITE_URL
        value: https://velmo.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        value: 9I4P7-ptGQYEPMJ_A-W0Io430Ih0krvOA3tDoAt5VBA
      - key: BING_SITE_VERIFICATION
        sync: false
