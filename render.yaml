services:
  - type: web
    name: velmo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 4
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: SITE_URL
        value: https://velmo.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        value: 9I4P7-ptGQYEPMJ_A-W0Io430Ih0krvOA3tDoAt5VBA
      - key: BING_SITE_VERIFICATION
        sync: false
